  '
queries:
- id: fdos-with-type-and-licence
  title: Every FDO with its type, licence and file count
  intro: The list the registry exists for, counted from the catalogue node outwards - the same query fdo-squirrel-registry
    runs as its own crosscheck against the facet page (queries.yaml, catalogue-overview).
  sparql: "SELECT ?fdo ?title ?type ?licence (COUNT(?distribution) AS ?files) WHERE {\n  ?catalogue a\
    \ dcat:Catalog ; dcat:dataset ?fdo .\n  ?fdo dct:title ?title ; a ?type .\n  FILTER(STRSTARTS(STR(?type),\
    \ STR(fdo:)))\n  OPTIONAL { ?fdo dct:license ?licence }\n  OPTIONAL { ?fdo dcat:distribution ?distribution\
    \ }\n} GROUP BY ?fdo ?title ?type ?licence ORDER BY ?title\n"
- id: classes-with-counts
  title: Classes used, with counts
  intro: What occurs in this collection - the counterpart to the VoID statistics.
  sparql: "SELECT ?class (COUNT(?s) AS ?count) WHERE {\n  ?s a ?class\n} GROUP BY ?class ORDER BY DESC(?count)\n"
